<body>
    <div id="navbar"></div>

    <div class="container">
        <h1>Calendar</h1>
        <button type="button" class="btn btn-secondary btn-sm" onclick="addEvent()">Add Event</button>
        <div id="calendar" class="container">

        </div>
    </div>

    <!-- code -->
    <script src="js/utils.js"></script>

    <script type="text/javascript">

        var calendar;

        $(function () {
            $("#navbar").load("navbar.html");

            var calendarEl = document.getElementById("calendar");
            calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'dayGridMonth,timeGridWeek,multiMonthYear,listMonth'
                },
                selectable: true,
                eventClick: function (data) {
                    var info = data.event._def.extendedProps.intake;
                    popupInfo(info);
                },
                // events: 
            });

            const eventSource = {
                events: [
                    {
                        title: 'Event1',
                        start: '2026-11-08'
                    },
                    {
                        title: 'Event2',
                        start: '2026-11-12'
                    }
                    // etc...
                ],
                color: 'yellow',   // an option!
                contrastColor: 'black' // an option!
            }

            var sources = getProjectEventSources();
            for( var i=0; i<sources.length; i++){
                calendar.addEventSource(sources[i]);
            }
            

            calendar.render();

        });

        function popupInfo(msg) {
            alert(msg);
        }

        function addEvent() {
            calendar.addEvent({
                id: 'b',
                title: 'Some other event',
                start: '2026-11-08'
            }
            );

            //calendar.render();
        }




    </script>
