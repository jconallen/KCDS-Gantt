<!DOCTYPE html>
<html>

<head>
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>

    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.5.3/papaparse.min.js"
        integrity="sha256-NVP7i99bgATOVTHmgn6ByLNOezmSZ3lndUVEBk6XsBY=" crossorigin="anonymous"></script>

    <script src="https://cdn.jsdelivr.net/npm/luxon@3.7.2/build/global/luxon.min.js"
        integrity="sha256-UWxf6lyCvfH7XEcrmq/cqc2m3IBrLBLOnWLC4Pw0gQQ=" crossorigin="anonymous"></script>

    <script src="https://cdn.jsdelivr.net/npm/async@3.2.6/dist/async.min.js"
        integrity="sha256-uDzWtmm1K/XBN81NsKQ3dxp0KF3jz7XPO8F3WAA0Whg=" crossorigin="anonymous"></script>

    <script src="https://cdn.jsdelivr.net/npm/idb@8.0.3/build/umd.min.js"></script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
        crossorigin="anonymous"></script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>

    <link rel="shortcut icon" type="image/x-icon" href="./favicon.ico">

</head>

<body>
    <div id="navbar"></div>

    <div class="container">
        <h1>Projects Visualizer</h1>

        <div class="container" style="padding-bottom:10px;">
            <button id="clear" type="button" class="btn btn-secondary btn-sm" onclick="clearData()">Clear Data</button>
        </div>

        <div class="container">
            <label class="drop" id="drop">
                <input type="file" id="file" accept=".xlsx">
            </label>
        </div>
        
        <div class="container">
            <h4>Projects</h4>
            <div id="divProjects" class="container" style="padding-top:10px;">
            </div>
        </div>

    </div>

    <!-- code -->
    <script src="js/utils.js"></script>

    <script type="text/javascript">

        $(function () {
            $("#navbar").load("navbar.html");
        });

        const fileInput = document.getElementById('file');
        fileInput.addEventListener('change', () => fileInput.files[0] && load(fileInput.files[0]));
        // ['dragover', 'dragenter'].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.add('over'); }));
        // ['dragleave', 'drop'].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.remove('over'); }));

        async function load(file) {
            if (!/\.xlsx$/i.test(file.name)) {
                console.log('ExcelJS reads .xlsx files only. Save older .xls files as .xlsx first.', true);
                return;
            }
            console.log('Reading ' + file.name );
            try {
                workbook = new ExcelJS.Workbook();
                await workbook.xlsx.load(await file.arrayBuffer());
                const worksheet = workbook.getWorksheet('Projects');
                parseWorksheet(worksheet);
            } catch (err) {
                console.log('Could not read this file: ' + err.message, true);
                alert('Could not read this file: ' + err.message);
            }
        }

        function refresh(){
            $('#divProjects').empty();
            var projects = getProjects();
            for( const project of projects ) {
                console.log( project.name );
                var color = project.color;
                var name = project.name;
                var owners = "";
                var dtStart = null;
                var dtEnd = null;
                for(const task of project.tasks){
                    if( !dtStart  ) {
                        dtStart = DateTime.fromISO(task.start);
                        dtEnd = DateTime.fromISO(task.start);
                    } else if( dtStart > DateTime.fromISO(task.start) ){
                        dtStart = DateTime.fromISO(task.start);
                        if( dtStart > dtEnd ) dtEnd = dtStart;
                    }

                    if( task.end ) {
                        var dt = DateTime.fromISO(task.end);
                        if( dt > dtEnd ) {
                            dtEnd = dt;
                        }
                    }

                    if( task.owner && !owners.includes(task.owner) ) {
                        if( owners.length > 1 ) owners += ", ";
                        owners += task.owner;
                    }
                }

                var start = dtStart.toFormat("L/d/yy");
                var end = dtEnd.toFormat("L/d/yy"); 

                var template = `            <div class="row">
                <div class="col-1 mb-1">
                    <span class="border" style="background-color:${color};" width="40"><i class="bi bi-bar-chart-steps"></i>&nbsp;</span>${name}</div>
                <div class="col-10">
                    [ ${start} - ${end} ], ${project.tasks.length} tasks, involved: ${owners}
                </div>
            </div>`;

                $('#divProjects').append(template);
                
            }

        }

        function clearData(){
            localStorage.clear();
        }

        refresh();

    </script>
</body>

</html>
