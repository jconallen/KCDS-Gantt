<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spreadsheet viewer</title>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<style>
  :root {
    --bg: #f6f7f5; --surface: #ffffff; --text: #1d2420; --muted: #5d6862;
    --line: #d9dedb; --accent: #1f6f4a; --head: #e8eeea;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #151a17; --surface: #1d2420; --text: #e8ede9; --muted: #9aa69f;
      --line: #33403a; --accent: #5cc08f; --head: #28332d; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #151a17; --surface: #1d2420; --text: #e8ede9; --muted: #9aa69f;
    --line: #33403a; --accent: #5cc08f; --head: #28332d; color-scheme: dark;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 1000px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  p.lead { margin: 0 0 20px; color: var(--muted); }
  label.drop {
    display: block; padding: 28px 16px; text-align: center; cursor: pointer;
    background: var(--surface); border: 2px dashed var(--line); border-radius: 8px;
  }
  label.drop:hover, label.drop.over, label.drop:focus-within { border-color: var(--accent); }
  label.drop input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  #status { margin: 16px 0 8px; color: var(--muted); }
  #status.error { color: #c0392b; }
  #tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 12px; }
  #tabs button {
    font: inherit; padding: 6px 14px; border-radius: 6px; cursor: pointer;
    background: var(--surface); color: var(--text); border: 1px solid var(--line);
  }
  #tabs button[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  #tabs button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .scroll { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
  table { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
  th, td { padding: 6px 10px; border: 1px solid var(--line); text-align: left; white-space: nowrap; }
  thead th, tbody th { background: var(--head); color: var(--muted); font-weight: 600; text-align: center; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<main>
  <h1>Spreadsheet viewer</h1>
  <p class="lead">Choose an .xlsx file to see its sheets. Nothing is uploaded; the file is read in your browser.</p>

  <label class="drop" id="drop">
    <input type="file" id="file" accept=".xlsx">
    <span>Choose an Excel file, or drop it here</span>
  </label>

  <div id="status" role="status"></div>
  <div id="tabs" role="tablist"></div>
  <div class="scroll" id="out" hidden></div>
</main>

<script>
  const fileInput = document.getElementById('file');
  const drop = document.getElementById('drop');
  const statusEl = document.getElementById('status');
  const tabs = document.getElementById('tabs');
  const out = document.getElementById('out');
  let workbook = null;

  fileInput.addEventListener('change', () => fileInput.files[0] && load(fileInput.files[0]));
  ['dragover', 'dragenter'].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.add('over'); }));
  ['dragleave', 'drop'].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', ev => ev.dataTransfer.files[0] && load(ev.dataTransfer.files[0]));

  function setStatus(msg, isError) {
    statusEl.textContent = msg;
    statusEl.className = isError ? 'error' : '';
  }

  async function load(file) {
    tabs.innerHTML = ''; out.hidden = true;
    if (!/\.xlsx$/i.test(file.name)) {
      setStatus('ExcelJS reads .xlsx files only. Save older .xls files as .xlsx first.', true);
      return;
    }
    setStatus('Reading ' + file.name + '…');
    try {
      workbook = new ExcelJS.Workbook();
      await workbook.xlsx.load(await file.arrayBuffer());
      const sheets = workbook.worksheets;
      if (!sheets.length) { setStatus('This workbook has no sheets.', true); return; }
      setStatus(file.name + ': ' + sheets.length + (sheets.length === 1 ? ' sheet' : ' sheets'));
      sheets.forEach((ws, i) => {
        const b = document.createElement('button');
        b.type = 'button'; b.role = 'tab'; b.textContent = ws.name;
        b.addEventListener('click', () => show(i));
        tabs.appendChild(b);
      });
      show(0);
    } catch (err) {
      setStatus('Could not read this file: ' + err.message, true);
    }
  }

  function cellText(cell) {
    const v = cell.value;
    if (v === null || v === undefined) return '';
    if (v instanceof Date) return v.toLocaleDateString();
    if (typeof v === 'object') {
      if ('result' in v) return v.result instanceof Date ? v.result.toLocaleDateString() : String(v.result ?? '');
      if (v.richText) return v.richText.map(r => r.text).join('');
      if (v.text) return String(v.text);
      if (v.error) return String(v.error);
    }
    return String(v);
  }

  function colName(n) {
    let s = '';
    while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); }
    return s;
  }

  function show(index) {
    [...tabs.children].forEach((b, i) => b.setAttribute('aria-selected', i === index));
    const ws = workbook.worksheets[index];
    const rows = ws.actualRowCount ? ws.rowCount : 0;
    const cols = ws.columnCount;
    if (!rows || !cols) { out.innerHTML = '<p style="padding:16px;margin:0">This sheet is empty.</p>'; out.hidden = false; return; }

    const table = document.createElement('table');
    const head = table.createTHead().insertRow();
    head.appendChild(document.createElement('th'));
    for (let c = 1; c <= cols; c++) {
      const th = document.createElement('th'); th.textContent = colName(c); head.appendChild(th);
    }
    const body = table.createTBody();
    for (let r = 1; r <= rows; r++) {
      const tr = body.insertRow();
      const rh = document.createElement('th'); rh.textContent = r; tr.appendChild(rh);
      const row = ws.getRow(r);
      for (let c = 1; c <= cols; c++) {
        const cell = row.getCell(c);
        const td = tr.insertCell();
        td.textContent = cellText(cell);
        if (typeof cell.value === 'number') td.className = 'num';
      }
    }
    out.replaceChildren(table);
    out.hidden = false;
  }
</script>
</body>
</html>
