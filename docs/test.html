<!DOCTYPE html>
<html>

<head>
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>

    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.5.3/papaparse.min.js"
        integrity="sha256-NVP7i99bgATOVTHmgn6ByLNOezmSZ3lndUVEBk6XsBY=" crossorigin="anonymous"></script>

    <script src="https://cdn.jsdelivr.net/npm/luxon@3.7.2/build/global/luxon.min.js"
        integrity="sha256-UWxf6lyCvfH7XEcrmq/cqc2m3IBrLBLOnWLC4Pw0gQQ=" crossorigin="anonymous"></script>

    <script src="https://cdn.jsdelivr.net/npm/async@3.2.6/dist/async.min.js"
        integrity="sha256-uDzWtmm1K/XBN81NsKQ3dxp0KF3jz7XPO8F3WAA0Whg=" crossorigin="anonymous"></script>

    <script src="https://cdn.jsdelivr.net/npm/idb@8.0.3/build/umd.min.js"></script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
        crossorigin="anonymous"></script>

    <script src="https://cdn.jsdelivr.net/npm/dhtmlx-gantt@10.0.3/codebase/dhtmlxgantt.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/dhtmlx-gantt@10.0.3/codebase/dhtmlxgantt.min.css">

    <link rel="shortcut icon" type="image/x-icon" href="./favicon.ico">
</head>

<body>
    <div id="navbar"></div>

    <div class="container">
        <h1>KCDS Gnatt Test</h1>
        <button id="day" type="button" class="btn btn-secondary btn-sm" onclick="scale('day')">Day</button>
        <button id="month" type="button" class="btn btn-secondary btn-sm" onclick="scale('month')">Month</button>
        <button id="year" type="button" class="btn btn-secondary btn-sm" onclick="scale('year')">Year</button>
        <div id="gantt_here" class="container" style="width:100%;height:400px;">
        </div>
    </div>

    <!-- code -->
    <script src="js/utils.js"></script>

    <script type="text/javascript">

        $(function () {
            $("#navbar").load("navbar.html");
            gantt.plugins({
                quick_info: true
            });

            const zoomConfig = {
                levels: [
                    {
                        name: "day",
                        scale_height: 27,
                        min_column_width: 80,
                        scales: [
                            { unit: "day", step: 1, format: "%d %M" }
                        ]
                    },
                    {
                        name: "week",
                        scale_height: 50,
                        min_column_width: 50,
                        scales: [
                            {
                                unit: "week",
                                step: 1,
                                format: (date) => {
                                    const formatDate = gantt.date.date_to_str("%d %M");
                                    const endDate = gantt.date.add(date, 6, "day");
                                    const weekNumber = gantt.date.date_to_str("%W")(date);
                                    return `#${weekNumber}, ${formatDate(date)} - ${formatDate(endDate)}`;
                                }
                            },
                            { unit: "day", step: 1, format: "%j %D" }
                        ]
                    },
                    {
                        name: "month",
                        scale_height: 50,
                        min_column_width: 120,
                        scales: [
                            { unit: "month", format: "%F, %Y" },
                            { unit: "week", format: "Week #%W" }
                        ]
                    },
                    {
                        name: "quarter",
                        height: 50,
                        min_column_width: 90,
                        scales: [
                            { unit: "month", step: 1, format: "%M" },
                            {
                                unit: "quarter",
                                step: 1,
                                format: (date) => {
                                    const formatDate = gantt.date.date_to_str("%M");
                                    const endDate = gantt.date.add(gantt.date.add(date, 3, "month"), -1, "day");
                                    return `${formatDate(date)} - ${formatDate(endDate)}`;
                                }
                            }
                        ]
                    },
                    {
                        name: "year",
                        scale_height: 50,
                        min_column_width: 30,
                        scales: [
                            { unit: "year", step: 1, format: "%Y" }
                        ]
                    }
                ]
            };

            gantt.ext.zoom.init(zoomConfig);

            gantt.config.columns = [
                { name: "text", label: "Task name", width: "*", tree: true },
                {
                    name: "owner", label: "Owner", template: (obj) => {
                        return `${obj.owner}`;
                    }
                },
                { name: "start_date", label: "Start time", align: "center" },
                { name: "duration", label: "Dur", align: "center" }
            ];

            gantt.config.layout = {
                css: "gantt_container",
                rows: [
                    {
                        cols: [
                            {
                                view: "grid", id: "grid", scrollX: "scrollHor",
                                scrollY: "scrollVer"
                            },
                            { resizer: true, width: 1 },
                            {
                                view: "timeline", id: "timeline", scrollX: "scrollHor",
                                scrollY: "scrollVer"
                            },
                            { view: "scrollbar", id: "scrollVer", scroll: "y" }
                        ]
                    },
                    { view: "scrollbar", id: "scrollHor", scroll: "x", height: 20 }
                ]
            };

            gantt.init("gantt_here");

            const data = {
                "tasks": [
                    { id: 3, text: "Fullam", type: "project", open: true, owner: "" },
                    { id: 4, text: "Survey", start_date: "16-11-2026", duration: 1, parent: 3, progress: 0, open: true, owner: "jim" },
                    { id: 5, text: "Floorplan Review", start_date: "02-12-2026", duration: 1, parent: 3, progress: 0, open: true, owner: "skylar" },
                    { id: 6, text: "Material Selection", start_date: "07-12-2026", duration: 1, parent: 3, progress: 0, open: true, owner: "" },
                    { id: 7, text: "Pricing Set", start_date: "14-12-2026", duration: 1, parent: 3, progress: 0, open: true, owner: "" },
                    { id: 8, text: "Contractor Bidding", start_date: "15-12-2026", duration: 30, parent: 3, progress: 0, open: true, owner: "" },
                    { id: 9, text: "Final Review", start_date: "16-01-2027", type: "milestone", parent: 3, progress: 0, open: true, owner: "" },
                    { id: 10, text: "Permit Set", start_date: "21-01-2027", duration: 1, parent: 3, progress: 0, open: true, owner: "" },
                    { id: 11, text: "Order Millwork", start_date: "22-01-2027", duration: 1, parent: 3, progress: 0, open: true, owner: "" },
                    { id: 12, text: "Millwork Delivery", start_date: "01-02-2027", duration: 5, parent: 3, progress: 0, open: true, owner: "" },
                    { id: 13, text: "Construction", start_date: "10-02-2027", duration: 30, parent: 3, progress: 0, open: true, owner: "" }
                ],
                "links": [
                    { source: 4, target: 5, type: 0 },
                    { source: 6, target: 7, type: 0 },
                    { source: 11, target: 12, type: 0 },
                    { source: 10, target: 13, type: 0 },
                    { source: 12, target: 13, type: 0 }
                ]
            };

            gantt.parse(data);

            gantt.ext.zoom.setLevel("month");
        });

        function scale(val) {
            gantt.ext.zoom.setLevel(val);
        }
    </script>
</body>

</html>
